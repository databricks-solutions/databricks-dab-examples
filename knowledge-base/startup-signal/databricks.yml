bundle:
  name: startup-signal

include:
  - resources/*.yml

variables:
  app_name:
    description: "App name (lowercase, digits, hyphens; max 30 chars)"
    default: signal-${workspace.current_user.domain_friendly_name}
  lakebase_endpoint:
    description: "Lakebase Postgres endpoint resource path"
    default: projects/starter-${workspace.current_user.domain_friendly_name}/branches/production/endpoints/primary

targets:
  default:
    mode: development
